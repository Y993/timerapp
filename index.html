<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="時刻表">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="manifest" href="manifest.json">
  <title>鎌取⇄幕張</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0d0d1a; color: #fff;
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    }

    /* ── Swipe wrapper ── */
    #wrap {
      display: flex; width: 300%; height: 100%;
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      will-change: transform;
    }
    .page {
      width: 33.333%; height: 100%; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top,20px) 20px env(safe-area-inset-bottom,20px) 20px;
      overflow: hidden;
    }

    /* ── Dots ── */
    #dots {
      position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 14px);
      left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 99;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,.25); transition: background .25s;
    }
    .dot.on { background: #fff; }

    /* ══════════════════════════════
       PAGE 1 – CLOCK
    ══════════════════════════════ */
    #clock-time {
      font-size: clamp(72px, 22vw, 120px);
      font-weight: 100; letter-spacing: -.02em;
      color: #e8f4fd; line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 60px rgba(79,195,247,.25);
    }
    #clock-sec {
      margin-top: 6px;
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 200; color: #4fc3f7;
      font-variant-numeric: tabular-nums;
    }
    #clock-date {
      margin-top: 20px;
      font-size: clamp(14px, 4.2vw, 22px);
      font-weight: 300; color: rgba(255,255,255,.55);
      letter-spacing: .06em;
    }

    /* ══════════════════════════════
       PAGE 2 – CALENDAR
    ══════════════════════════════ */
    .cal-page { justify-content: flex-start; padding-top: 52px; }

    .cal-head {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; margin-bottom: 18px;
    }
    .cal-nav {
      width: 38px; height: 38px; border-radius: 50%;
      border: none; background: rgba(255,255,255,.08); color: #fff;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    #cal-label { font-size: clamp(16px, 5.5vw, 24px); font-weight: 300; }

    .cal-grid { width: 100%; }
    .cal-wdays {
      display: grid; grid-template-columns: repeat(7,1fr);
      margin-bottom: 6px;
    }
    .cal-wd {
      text-align: center; font-size: clamp(10px,3.2vw,14px);
      color: rgba(255,255,255,.35); padding: 4px 0;
    }
    .cal-wd:first-child { color: rgba(255,100,100,.65); }
    .cal-wd:last-child  { color: rgba(100,150,255,.65); }

    .cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
    .cd {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: clamp(12px, 3.8vw, 18px); border-radius: 50%;
      color: rgba(255,255,255,.82);
    }
    .cd.sun { color: rgba(255,110,110,.85); }
    .cd.sat { color: rgba(120,160,255,.85); }
    .cd.other { color: rgba(255,255,255,.2); }
    .cd.today {
      background: #4fc3f7; color: #0d0d1a !important;
      font-weight: 700;
    }

    /* ══════════════════════════════
       PAGE 3 – TRAIN
    ══════════════════════════════ */
    .train-page { justify-content: flex-start; padding-top: 44px; overflow-y: auto; }

    .route-title {
      font-size: clamp(12px, 3.6vw, 16px); color: rgba(255,255,255,.4);
      margin-bottom: 14px; font-weight: 300; letter-spacing: .05em;
    }

    .toggles { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 16px; }
    .tg {
      display: flex; background: rgba(255,255,255,.07); border-radius: 10px; padding: 3px;
    }
    .tb {
      flex: 1; padding: 9px 0; text-align: center;
      font-size: clamp(12px, 3.8vw, 16px); border: none; background: transparent;
      color: rgba(255,255,255,.45); border-radius: 8px; cursor: pointer; transition: all .2s;
    }
    .tb.on { background: #4fc3f7; color: #0d0d1a; font-weight: 600; }

    #train-list { width: 100%; display: flex; flex-direction: column; gap: 9px; }

    .tcard {
      background: rgba(255,255,255,.055); border-radius: 14px;
      padding: 13px 16px; display: flex; align-items: center; justify-content: space-between;
      border: 1px solid rgba(255,255,255,.06);
    }
    .tcard.nxt { background: rgba(79,195,247,.11); border-color: rgba(79,195,247,.28); }

    .tcard-left {}
    .tc-label { font-size: clamp(10px,3vw,13px); color: rgba(255,255,255,.38); margin-bottom: 3px; }
    .nxt .tc-label { color: #4fc3f7; }
    .tc-dep {
      font-size: clamp(34px,9vw,48px); font-weight: 200; color: #fff;
      font-variant-numeric: tabular-nums; line-height: 1;
    }
    .tc-cdwn { font-size: clamp(11px,3.2vw,14px); color: #4fc3f7; margin-top: 3px; }

    .tcard-right { text-align: right; }
    .tc-arr-lbl { font-size: clamp(10px,2.8vw,12px); color: rgba(255,255,255,.32); margin-bottom: 2px; }
    .tc-arr { font-size: clamp(18px,5.2vw,24px); color: rgba(255,255,255,.72); font-variant-numeric: tabular-nums; }
    .tc-via { font-size: clamp(10px,2.8vw,12px); color: rgba(255,255,255,.28); margin-top: 3px; }

    .no-train { text-align: center; color: rgba(255,255,255,.3); font-size: 4vw; padding: 28px 0; }
  </style>
</head>
<body>

<div id="wrap">

  <!-- ── Page 1: Clock ── -->
  <div class="page">
    <div id="clock-time">00:00</div>
    <div id="clock-sec">00</div>
    <div id="clock-date"></div>
  </div>

  <!-- ── Page 2: Calendar ── -->
  <div class="page cal-page">
    <div class="cal-head">
      <button class="cal-nav" id="cal-prev">‹</button>
      <div id="cal-label"></div>
      <button class="cal-nav" id="cal-next">›</button>
    </div>
    <div class="cal-grid">
      <div class="cal-wdays">
        <div class="cal-wd">日</div><div class="cal-wd">月</div><div class="cal-wd">火</div>
        <div class="cal-wd">水</div><div class="cal-wd">木</div><div class="cal-wd">金</div>
        <div class="cal-wd">土</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>
  </div>

  <!-- ── Page 3: Train ── -->
  <div class="page train-page">
    <div class="route-title">千葉駅乗り換え</div>
    <div class="toggles">
      <div class="tg">
        <button class="tb" id="btn-wd" onclick="setDay('wd')">平日</button>
        <button class="tb" id="btn-hd" onclick="setDay('hd')">土日祝</button>
      </div>
      <div class="tg">
        <button class="tb" id="btn-go" onclick="setDir('go')">🚃 鎌取 → 幕張</button>
        <button class="tb" id="btn-rt" onclick="setDir('rt')">🚃 幕張 → 鎌取</button>
      </div>
    </div>
    <div id="train-list"></div>
  </div>

</div>

<div id="dots">
  <div class="dot on" id="d0"></div>
  <div class="dot" id="d1"></div>
  <div class="dot" id="d2"></div>
</div>

<script>
// ============================================================
//  TIMETABLE DATA
//  Format: [departure_minutes_from_midnight, arrival_at_chiba_minutes]
//  0時台 trains are stored as 24*60+min for midnight-crossing logic
// ============================================================

function mkSched(map, travel) {
  const r = [];
  for (const [h, mins] of Object.entries(map)) {
    const hh = parseInt(h);
    const base = (hh === 0 ? 24 : hh) * 60;
    for (const m of mins) r.push([base + m, base + m + travel]);
  }
  return r.sort((a, b) => a[0] - b[0]);
}

// 鎌取 → 千葉（外房線）平日・休日共通
// 出発時刻, 千葉着時刻 [分]
const KAM_CHB = [
  [332,344],[362,376],[384,399],[402,417],[414,425],
  [428,439],[435,447],[439,452],[447,462],[464,475],
  [472,484],[481,495],[488,500],[494,511],[510,522],
  [517,528],[533,544],[545,556],[561,576],[574,586],
  [590,601],[612,623],[622,633],[636,649],[649,661],
  [662,675],[681,691],[700,712],[710,721],[745,763],
  [760,772],[771,789],[805,823],[819,831],[837,849],
  [865,884],[880,890],[892,909],[940,951],[953,964],
  [995,1009],[1010,1025],[1030,1049],[1055,1066],[1063,1074],
  [1070,1081],[1090,1104],[1096,1107],[1100,1113],[1117,1128],
  [1133,1145],[1152,1163],[1166,1177],[1180,1191],[1189,1200],
  [1200,1214],[1208,1222],[1225,1241],[1238,1250],
  [1260,1277],[1277,1290],[1286,1299],[1295,1305],
  [1345,1356],[1354,1367],
  [1382,1393],[1412,1423]
];

// 幕張 → 千葉（総武線）平日 ※所要10分
const MAK_CHB_WD = mkSched({
  4:[49], 5:[0,13,23,36,45,56],
  6:[4,12,18,23,27,32,37,44,50,54],
  7:[0,4,8,13,16,20,24,29,34,39,44,52],
  8:[0,8,16,23,31,41,50],
  9:[1,9,17,24,32,41,48,55],
  10:[3,10,18,26,32,43,54],
  11:[5,16,26,37,48,59],
  12:[10,21,32,43,54],
  13:[5,16,27,38,49],
  14:[0,10,21,32,43,54],
  15:[5,16,27,38,50],
  16:[1,11,17,28,38,48,54],
  17:[3,13,23,31,39,48,56],
  18:[2,8,16,22,27,37,47,53,58],
  19:[7,14,19,28,33,39,48,53,59],
  20:[5,12,22,31,41,46,53],
  21:[3,10,16,22,29,38,44,54],
  22:[3,11,17,27,33,43,49],
  23:[1,9,22,36,55],
  0:[11,33,51]
}, 10);

// 幕張 → 千葉（総武線）休日 ※所要10分
const MAK_CHB_HD = mkSched({
  4:[49], 5:[0,14,36,47],
  6:[2,17,23,31,39,47,53],
  7:[0,11,19,28,37,43,48,59],
  8:[6,13,23,33,43,53],
  9:[3,13,23,33,44,55],
  10:[6,16,26,36,46,56],
  11:[6,16,26,36,46,56],
  12:[6,16,26,36,46,56],
  13:[6,16,26,36,46,56],
  14:[6,16,26,36,46,56],
  15:[6,16,26,36,46,56],
  16:[6,16,26,36,46,56],
  17:[6,16,26,36,46,56],
  18:[6,16,26,36,46,56],
  19:[6,16,26,36,46,56],
  20:[7,18,29,40,51],
  21:[2,12,22,33,44,54],
  22:[5,16,27,34,43,49],
  23:[1,9,20,36,55],
  0:[14,33,51]
}, 10);

const SCHED = {
  wd: { go: KAM_CHB, rt: MAK_CHB_WD },
  hd: { go: KAM_CHB, rt: MAK_CHB_HD }
};

const DIR_INFO = {
  go: { depSt:'鎌取', arrSt:'千葉', onward:'→ 総武線で幕張へ' },
  rt: { depSt:'幕張', arrSt:'千葉', onward:'→ 外房線で鎌取へ' }
};

// ============================================================
//  STATE
// ============================================================

let curPage = 0;
let dayMode = 'wd';
let dirMode = 'go';

const today = new Date();
let calY = today.getFullYear();
let calM = today.getMonth();

// ============================================================
//  SWIPE
// ============================================================

const wrap = document.getElementById('wrap');
let tx0 = 0, ty0 = 0, swiping = false;

wrap.addEventListener('touchstart', e => {
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
  swiping = true;
}, {passive: true});

wrap.addEventListener('touchmove', e => {
  if (!swiping) return;
  if (Math.abs(e.touches[0].clientX - tx0) > Math.abs(e.touches[0].clientY - ty0))
    e.preventDefault();
}, {passive: false});

wrap.addEventListener('touchend', e => {
  if (!swiping) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - tx0;
  const dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 44) {
    if (dx < 0 && curPage < 2) goPage(curPage + 1);
    if (dx > 0 && curPage > 0) goPage(curPage - 1);
  }
});

function goPage(n) {
  curPage = n;
  wrap.style.transform = `translateX(-${n * 33.333}%)`;
  [0,1,2].forEach(i => document.getElementById('d'+i).classList.toggle('on', i===n));
}

// ============================================================
//  CLOCK
// ============================================================

const WDAYS = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];

function p2(n) { return String(n).padStart(2,'0'); }

function tickClock() {
  const n = new Date();
  document.getElementById('clock-time').textContent = `${p2(n.getHours())}:${p2(n.getMinutes())}`;
  document.getElementById('clock-sec').textContent  = p2(n.getSeconds());
  document.getElementById('clock-date').textContent =
    `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日　${WDAYS[n.getDay()]}`;
  if (curPage === 2) renderTrains();
}

// ============================================================
//  CALENDAR
// ============================================================

function renderCal() {
  document.getElementById('cal-label').textContent = `${calY}年 ${calM+1}月`;
  const first = new Date(calY, calM, 1).getDay();
  const last  = new Date(calY, calM+1, 0).getDate();
  const prevLast = new Date(calY, calM, 0).getDate();
  const tY = today.getFullYear(), tM = today.getMonth(), tD = today.getDate();
  let h = '';
  for (let i = first-1; i >= 0; i--) {
    const col = first-1-i;
    h += `<div class="cd other ${col===0?'sun':col===6?'sat':''}">${prevLast-i}</div>`;
  }
  for (let d = 1; d <= last; d++) {
    const col = (first+d-1)%7;
    const isT = d===tD && calY===tY && calM===tM;
    h += `<div class="cd ${col===0?'sun':col===6?'sat':''} ${isT?'today':''}">${d}</div>`;
  }
  const cells = Math.ceil((first+last)/7)*7;
  for (let d = 1; d <= cells-first-last; d++) {
    const col = (first+last+d-1)%7;
    h += `<div class="cd other ${col===0?'sun':col===6?'sat':''}">${d}</div>`;
  }
  document.getElementById('cal-days').innerHTML = h;
}

document.getElementById('cal-prev').onclick = () => { calM--; if(calM<0){calM=11;calY--;} renderCal(); };
document.getElementById('cal-next').onclick = () => { calM++; if(calM>11){calM=0;calY++;} renderCal(); };

// ============================================================
//  TRAIN
// ============================================================

function setDay(mode) {
  dayMode = mode;
  document.getElementById('btn-wd').classList.toggle('on', mode==='wd');
  document.getElementById('btn-hd').classList.toggle('on', mode==='hd');
  renderTrains();
}

function setDir(mode) {
  dirMode = mode;
  document.getElementById('btn-go').classList.toggle('on', mode==='go');
  document.getElementById('btn-rt').classList.toggle('on', mode==='rt');
  renderTrains();
}

function fmt(mins) {
  const h = Math.floor(mins/60)%24;
  return `${p2(h)}:${p2(mins%60)}`;
}

function renderTrains() {
  const n = new Date();
  let now = n.getHours()*60 + n.getMinutes();
  if (n.getHours() < 5) now += 1440; // midnight crossing

  const list = SCHED[dayMode][dirMode];
  const info = DIR_INFO[dirMode];
  const upcoming = list.filter(t => t[0] >= now && t[0] <= now + 180).slice(0, 5);

  if (!upcoming.length) {
    document.getElementById('train-list').innerHTML =
      `<div class="no-train">この時間帯の電車はありません</div>`;
    return;
  }

  const labels = ['次の電車','その次','3本目','4本目','5本目'];
  let h = '';
  upcoming.forEach((t, i) => {
    const wait = t[0] - now;
    const cdwn = wait === 0 ? '発車中' : wait === 1 ? 'あと1分' : `あと${wait}分`;
    h += `
      <div class="tcard ${i===0?'nxt':''}">
        <div class="tcard-left">
          <div class="tc-label">${labels[i]}</div>
          <div class="tc-dep">${fmt(t[0])}</div>
          ${i===0 ? `<div class="tc-cdwn">${cdwn}</div>` : ''}
        </div>
        <div class="tcard-right">
          <div class="tc-arr-lbl">千葉着</div>
          <div class="tc-arr">${fmt(t[1])}</div>
          <div class="tc-via">${info.onward}</div>
        </div>
      </div>`;
  });
  document.getElementById('train-list').innerHTML = h;
}

// ============================================================
//  INIT
// ============================================================

// Auto day type
const dw = today.getDay();
dayMode = (dw===0||dw===6) ? 'hd' : 'wd';
setDay(dayMode);
setDir('go');
renderCal();
tickClock();
setInterval(tickClock, 1000);
</script>
</body>
</html>
