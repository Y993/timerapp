<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="時刻表">
  <meta name="theme-color" content="#060612">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet">
  <title>鎌取⇄幕張</title>
  <style>
    /* ══ テーマ変数（JS から上書き） ══ */
    :root {
      --bg:    #060612;
      --bg2:   #0d1b2e;
      --ac:    #4fc3f7;
      --gf:    #ffffff;
      --gm:    #c8e9ff;
      --gt:    #4fc3f7;
      --g1:    rgba(79,195,247,.85);
      --g2:    rgba(79,195,247,.40);
      --g3:    rgba(79,195,247,.18);
      --gbg:   rgba(79,195,247,.07);
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: #fff;
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    }

    /* ── スワイプ ── */
    #wrap {
      display: flex; width: 300%; height: 100%;
      transition: transform .35s cubic-bezier(.4,0,.2,1);
    }
    .page {
      width: 33.333%; height: 100%; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding:
        max(env(safe-area-inset-top,0px),0px)
        max(env(safe-area-inset-right,16px),16px)
        max(env(safe-area-inset-bottom,0px),32px)
        max(env(safe-area-inset-left,16px),16px);
      overflow: hidden;
    }

    /* ── ページドット ── */
    #dots {
      position: fixed;
      bottom: calc(max(env(safe-area-inset-bottom,0px),0px) + 14px);
      left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 99;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,.22); transition: background .25s;
    }
    .dot.on { background: var(--ac); }

    /* ════════════════════════════════
       PAGE 1 — 時計（シック）
    ════════════════════════════════ */
    .clock-page {
      background: linear-gradient(175deg, var(--bg2) 0%, var(--bg) 58%);
      position: relative; overflow: hidden; cursor: pointer;
      user-select: none;
    }
    .clock-page::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
      background-size: 72px 72px;
      pointer-events: none;
    }

    .clock-wrap {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
    }

    .clock-sup {
      font-family: 'Josefin Sans', -apple-system, sans-serif;
      font-size: clamp(7px, 1.8vw, 10px);
      letter-spacing: .7em; color: var(--ac); opacity: .38;
      font-weight: 200; margin-bottom: clamp(4px, 1.5vw, 10px);
      text-transform: uppercase; transition: color .4s;
    }

    #clock-time {
      font-family: 'Josefin Sans', -apple-system, sans-serif;
      font-size: clamp(140px, 40vw, 320px);
      font-weight: 100; letter-spacing: .04em; line-height: 1;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(160deg, var(--gf) 0%, var(--gm) 52%, var(--gt) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 28px var(--g3));
    }

    .clock-main::after {
      content: '';
      display: block;
      height: 1px;
      margin-top: clamp(5px, 1.2vw, 9px);
      background: linear-gradient(90deg, transparent 0%, var(--ac) 50%, transparent 100%);
      opacity: .18;
    }
    .colon {
      display: inline-block;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.10} }

    .clock-sub {
      margin-top: clamp(10px, 2.5vw, 20px);
      display: flex; flex-direction: column; align-items: center; gap: clamp(8px,2vw,14px);
    }

    .sec-row {
      display: flex; align-items: center; gap: 10px;
      width: clamp(160px, 52vw, 340px);
    }
    .sec-track {
      flex: 1; height: 3px;
      background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden;
    }
    #sec-bar {
      height: 100%; width: 0%; border-radius: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--gt) 60%, var(--ac) 100%);
    }
    #clock-sec {
      font-size: clamp(14px, 3.8vw, 22px);
      color: var(--ac); font-variant-numeric: tabular-nums;
      font-weight: 300; min-width: 2.2ch; text-align: right;
      transition: color .4s;
    }

    #clock-date {
      font-size: clamp(13px, 3.8vw, 22px);
      color: rgba(255,255,255,.42); font-weight: 300; letter-spacing: .05em;
    }

    /* テーマドット */
    .theme-dots {
      margin-top: clamp(12px, 3vw, 22px);
      display: flex; gap: 10px;
    }
    .tdot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,.18); transition: background .3s, transform .3s;
    }
    .tdot.on {
      background: var(--ac); transform: scale(1.5);
    }

    /* テーマ名フラッシュ */
    #theme-name {
      position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
      font-size: clamp(10px, 2.5vw, 13px); letter-spacing: .4em;
      color: var(--ac); opacity: 0;
      text-transform: uppercase; pointer-events: none;
      transition: opacity .35s;
    }

    /* ════════════════════════════════
       PAGE 2 — カレンダー
    ════════════════════════════════ */
    .cal-page { justify-content: flex-start; }

    .cal-scroll {
      width: 100%; overflow-y: auto;
      padding: 50px 0 40px;
      -webkit-overflow-scrolling: touch;
    }

    .cal-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .cal-nav {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; background: rgba(255,255,255,.09); color: #fff;
      font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #cal-label { font-size: clamp(18px, 5.5vw, 26px); font-weight: 300; }

    .cal-wdays {
      display: grid; grid-template-columns: repeat(7,1fr);
      margin-bottom: 6px;
    }
    .cal-wd {
      text-align: center; font-size: clamp(11px, 3.2vw, 15px);
      color: rgba(255,255,255,.32); padding: 4px 0;
    }
    .cal-wd:first-child { color: rgba(255,100,100,.65); }
    .cal-wd:last-child  { color: rgba(120,160,255,.65); }

    .cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
    .cd {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: clamp(15px, 4.6vw, 22px); /* ← 大きめ・太め */
      font-weight: 500;
      border-radius: 50%; color: rgba(255,255,255,.88);
    }
    .cd.sun   { color: rgba(255,100,100,.9); }
    .cd.sat   { color: rgba(120,160,255,.9); }
    .cd.hol   { color: rgba(255,100,100,.9); }
    .cd.other { color: rgba(255,255,255,.2); font-weight: 400; }
    .cd.today { background: var(--ac); color: #060612 !important; font-weight: 800; }

    /* ════════════════════════════════
       PAGE 3 — 時刻表
    ════════════════════════════════ */
    .train-page { justify-content: flex-start; overflow-y: auto; }

    .train-inner {
      width: 100%; padding: 50px 0 40px;
      display: flex; flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }

    .route-title {
      text-align: center; font-weight: 300;
      font-size: clamp(11px, 3vw, 14px);
      color: rgba(255,255,255,.3); margin-bottom: 12px;
    }

    .toggles { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 14px; }
    .tg { display: flex; background: rgba(255,255,255,.07); border-radius: 10px; padding: 3px; }
    .tb {
      flex: 1; padding: 9px 4px; text-align: center;
      font-size: clamp(12px, 3.4vw, 15px); border: none; background: transparent;
      color: rgba(255,255,255,.4); border-radius: 8px; cursor: pointer; transition: all .2s;
    }
    .tb.on { background: var(--ac); color: #060612; font-weight: 600; }

    #train-list { width: 100%; display: flex; flex-direction: column; gap: 9px; }

    .tcard {
      background: rgba(255,255,255,.055); border-radius: 14px;
      padding: 12px 15px; border: 1px solid rgba(255,255,255,.07);
    }
    .tcard.nxt { background: rgba(79,195,247,.1); border-color: rgba(79,195,247,.28); }

    .tcard-top { display: flex; align-items: flex-start; justify-content: space-between; }

    .tc-label { font-size: clamp(10px,2.8vw,12px); color: rgba(255,255,255,.32); margin-bottom: 2px; }
    .nxt .tc-label { color: var(--ac); }
    .tc-dep {
      font-size: clamp(32px,8.5vw,46px); font-weight: 200;
      font-variant-numeric: tabular-nums; line-height: 1; color: #fff;
    }
    .tc-dep-st { font-size: clamp(9px,2.4vw,11px); color: rgba(255,255,255,.3); margin-top: 2px; }

    .tc-right { text-align: right; }
    .tc-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 5px; }
    .tc-row + .tc-row { margin-top: 5px; }
    .tc-lbl { font-size: clamp(9px,2.4vw,11px); color: rgba(255,255,255,.3); }
    .tc-val { font-size: clamp(16px,4.4vw,22px); font-variant-numeric: tabular-nums; color: rgba(255,255,255,.72); }
    .tc-row.dest .tc-lbl { color: rgba(79,195,247,.65); }
    .tc-row.dest .tc-val { color: #81d4fa; font-size: clamp(18px,4.8vw,24px); }
    .tc-row.miss .tc-val { color: rgba(255,120,120,.75); font-size: clamp(13px,3.5vw,17px); }

    .tcard-bot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 8px; padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .tc-via  { font-size: clamp(9px,2.4vw,11px); color: rgba(255,255,255,.22); }
    .tc-cdwn { font-size: clamp(11px,3vw,13px); color: var(--ac); }

    .no-train { text-align: center; color: rgba(255,255,255,.28); font-size: 4vw; padding: 24px 0; }

    /* ════════════════════════════════
       横画面（LANDSCAPE）
    ════════════════════════════════ */
    @media (orientation: landscape) {
      .page {
        padding:
          max(env(safe-area-inset-top,0px),0px)
          max(env(safe-area-inset-right,16px),16px)
          max(env(safe-area-inset-bottom,0px),24px)
          max(env(safe-area-inset-left,16px),16px);
        justify-content: center;
      }
      #dots { bottom: max(env(safe-area-inset-bottom,0px),6px); }
      .dot  { width: 6px; height: 6px; }

      /* 時計：左=時刻 / 右=秒+日付 */
      .clock-wrap {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 4vw, 52px);
        width: 100%;
      }
      .clock-sup { display: none; }
      #clock-time { font-size: clamp(90px, 43vh, 200px); white-space: nowrap; }
      .clock-wrap { max-width: 100%; }
      .clock-sub  { align-items: flex-start; margin-top: 0; }
      .sec-row    { width: clamp(140px, 24vw, 280px); }
      #clock-sec  { font-size: clamp(16px, 5vh, 26px); }
      #clock-date { font-size: clamp(14px, 4vh, 22px); }
      .theme-dots { margin-top: clamp(8px, 2vh, 14px); }
      #theme-name { bottom: 44px; }

      /* カレンダー */
      .cal-page   { justify-content: center; }
      .cal-scroll { padding: 0; overflow-y: visible; height: 100%; display: flex; flex-direction: column; justify-content: center; }
      .cal-head   { margin-bottom: 8px; }
      #cal-label  { font-size: clamp(15px, 4.2vh, 22px); }
      .cal-nav    { width: 32px; height: 32px; font-size: 17px; }
      .cal-wdays  { margin-bottom: 3px; }
      .cal-wd     { font-size: clamp(10px, 2.5vh, 14px); padding: 2px 0; }
      .cal-days   { gap: 2px; }
      .cd {
        aspect-ratio: unset;
        height: clamp(28px, 9.5vh, 46px);
        font-size: clamp(12px, 3vh, 18px);
        font-weight: 600; border-radius: 8px;
      }

      /* 時刻表 */
      .train-page   { justify-content: center; overflow-y: visible; }
      .train-inner  { padding: 0; overflow-y: auto; height: 100%; justify-content: center; }
      .route-title  { margin-bottom: 6px; font-size: clamp(10px, 2.5vh, 13px); }
      .toggles      { flex-direction: row; gap: 8px; margin-bottom: 8px; }
      .tg           { flex: 1; }
      .tb           { padding: 7px 4px; font-size: clamp(10px, 2.8vh, 13px); }
      #train-list   { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .tcard        { padding: 9px 12px; border-radius: 11px; }
      .tc-label     { font-size: clamp(9px, 2vh, 11px); }
      .tc-dep       { font-size: clamp(22px, 7.5vh, 40px); }
      .tc-dep-st    { font-size: clamp(8px, 1.9vh, 10px); }
      .tc-lbl       { font-size: clamp(8px, 2vh, 10px); }
      .tc-val       { font-size: clamp(13px, 3.8vh, 18px); }
      .tc-row.dest .tc-val { font-size: clamp(14px, 4vh, 19px); }
      .tcard-bot    { margin-top: 5px; padding-top: 4px; }
      .tc-via       { font-size: clamp(8px, 1.9vh, 10px); }
      .tc-cdwn      { font-size: clamp(9px, 2.5vh, 12px); }
      .no-train     { font-size: 3vh; }
    }
  </style>
</head>
<body>

<div id="wrap">

  <!-- ── Page 1: 時計 ── -->
  <div class="page clock-page" id="clock-pg">
    <div class="clock-wrap">
      <!-- 縦：左列 / 横：左パネル -->
      <div class="clock-main">
        <div class="clock-sup">LOCAL TIME</div>
        <div id="clock-time">
          <span id="ch">00</span><span class="colon">:</span><span id="cm">00</span>
        </div>
      </div>
      <!-- 縦：右下 / 横：右パネル -->
      <div class="clock-sub">
        <div class="sec-row">
          <div class="sec-track"><div id="sec-bar"></div></div>
          <div id="clock-sec">00</div>
        </div>
        <div id="clock-date"></div>
        <div class="theme-dots" id="theme-dots">
          <div class="tdot on" id="td0"></div>
          <div class="tdot"    id="td1"></div>
          <div class="tdot"    id="td2"></div>
          <div class="tdot"    id="td3"></div>
          <div class="tdot"    id="td4"></div>
        </div>
      </div>
    </div>
    <div id="theme-name"></div>
  </div>

  <!-- ── Page 2: カレンダー ── -->
  <div class="page cal-page">
    <div class="cal-scroll">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev">‹</button>
        <div id="cal-label"></div>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-wdays">
        <div class="cal-wd">日</div><div class="cal-wd">月</div><div class="cal-wd">火</div>
        <div class="cal-wd">水</div><div class="cal-wd">木</div><div class="cal-wd">金</div>
        <div class="cal-wd">土</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>
  </div>

  <!-- ── Page 3: 時刻表 ── -->
  <div class="page train-page">
    <div class="train-inner">
      <div class="route-title">千葉乗換3分想定 ／ 幕張着・鎌取着は実時間</div>
      <div class="toggles">
        <div class="tg">
          <button class="tb" id="btn-wd" onclick="setDay('wd')">平日</button>
          <button class="tb" id="btn-hd" onclick="setDay('hd')">土日祝</button>
        </div>
        <div class="tg">
          <button class="tb" id="btn-go" onclick="setDir('go')">🚃 鎌取 → 幕張</button>
          <button class="tb" id="btn-rt" onclick="setDir('rt')">🚃 幕張 → 鎌取</button>
        </div>
      </div>
      <div id="train-list"></div>
    </div>
  </div>
</div>

<div id="dots">
  <div class="dot on" id="d0"></div>
  <div class="dot"    id="d1"></div>
  <div class="dot"    id="d2"></div>
</div>

<script>
// ============================================================
//  テーマ定義（タップで切り替え）
// ============================================================
const THEMES = [
  { name:'PLATINUM',
    bg:'#080808', bg2:'#141414', ac:'#c8c8c8',
    gf:'#ffffff', gm:'#e0e0e0', gt:'#a8a8a8',
    g1:'rgba(200,200,200,.45)', g2:'rgba(200,200,200,.18)',
    g3:'rgba(200,200,200,.07)', gbg:'rgba(200,200,200,.04)' },
  { name:'NAVY',
    bg:'#030610', bg2:'#081428', ac:'#7eb8d8',
    gf:'#f0f8ff', gm:'#b8d8f0', gt:'#7eb8d8',
    g1:'rgba(126,184,216,.45)', g2:'rgba(126,184,216,.18)',
    g3:'rgba(126,184,216,.07)', gbg:'rgba(126,184,216,.04)' },
  { name:'AMBER',
    bg:'#080500', bg2:'#1a1000', ac:'#c8a040',
    gf:'#fffde8', gm:'#e8c870', gt:'#c8a040',
    g1:'rgba(200,160,64,.45)', g2:'rgba(200,160,64,.18)',
    g3:'rgba(200,160,64,.07)', gbg:'rgba(200,160,64,.04)' },
  { name:'SAGE',
    bg:'#030a06', bg2:'#0a1e10', ac:'#82a878',
    gf:'#f0fff4', gm:'#bce0b4', gt:'#82a878',
    g1:'rgba(130,168,120,.45)', g2:'rgba(130,168,120,.18)',
    g3:'rgba(130,168,120,.07)', gbg:'rgba(130,168,120,.04)' },
  { name:'ROSE',
    bg:'#0a0306', bg2:'#1e0810', ac:'#c87890',
    gf:'#fff0f4', gm:'#e8b0c0', gt:'#c87890',
    g1:'rgba(200,120,144,.45)', g2:'rgba(200,120,144,.18)',
    g3:'rgba(200,120,144,.07)', gbg:'rgba(200,120,144,.04)' },
];

let themeIdx = parseInt(localStorage.getItem('themeIdx') || '0');

function applyTheme(t) {
  const r = document.documentElement.style;
  r.setProperty('--bg',  t.bg);
  r.setProperty('--bg2', t.bg2);
  r.setProperty('--ac',  t.ac);
  r.setProperty('--gf',  t.gf);
  r.setProperty('--gm',  t.gm);
  r.setProperty('--gt',  t.gt);
  r.setProperty('--g1',  t.g1);
  r.setProperty('--g2',  t.g2);
  r.setProperty('--g3',  t.g3);
  r.setProperty('--gbg', t.gbg);
  document.body.style.background = t.bg;
  // ドット更新
  for (let i = 0; i < 5; i++)
    document.getElementById('td'+i).classList.toggle('on', i === themeIdx);
}

// テーマ切り替え（時計ページタップ）
document.getElementById('clock-pg').addEventListener('click', () => {
  themeIdx = (themeIdx + 1) % THEMES.length;
  localStorage.setItem('themeIdx', themeIdx);
  applyTheme(THEMES[themeIdx]);
  const nm = document.getElementById('theme-name');
  nm.textContent = THEMES[themeIdx].name;
  nm.style.opacity = '1';
  clearTimeout(window._thTm);
  window._thTm = setTimeout(() => nm.style.opacity = '0', 1600);
});

// ============================================================
//  日本の祝日
// ============================================================
function buildHolidays(year) {
  const h = {};
  function add(m, d) { if (d > 0) h[`${year}-${m}-${d}`] = true; }
  function nthMon(m, n) {
    let c = 0;
    for (let d = 1; d <= 31; d++) {
      const dt = new Date(year, m - 1, d);
      if (dt.getMonth() !== m - 1) break;
      if (dt.getDay() === 1 && ++c === n) return d;
    }
    return -1;
  }
  add(1,1); add(2,11); add(2,23);
  add(4,29); add(5,3); add(5,4); add(5,5);
  add(8,11); add(11,3); add(11,23);
  add(1, nthMon(1,2)); add(7, nthMon(7,3));
  add(9, nthMon(9,3)); add(10, nthMon(10,2));
  const EQ = {
    2024:{3:20,9:22}, 2025:{3:20,9:23}, 2026:{3:20,9:23},
    2027:{3:21,9:23}, 2028:{3:20,9:22}, 2029:{3:20,9:23}
  };
  if (EQ[year]) { add(3, EQ[year][3]); add(9, EQ[year][9]); }
  // 振替休日
  Object.keys(h).forEach(key => {
    const dt = new Date(key);
    if (dt.getDay() === 0) {
      const nx = new Date(dt); nx.setDate(nx.getDate() + 1);
      h[`${nx.getFullYear()}-${nx.getMonth()+1}-${nx.getDate()}`] = true;
    }
  });
  return h;
}

// ============================================================
//  時刻表データ（分単位）
// ============================================================
function mkSched(map, travel) {
  const r = [];
  for (const [h, mins] of Object.entries(map)) {
    const hh = parseInt(h);
    const base = (hh === 0 ? 24 : hh) * 60;
    for (const m of mins) r.push([base + m, base + m + travel]);
  }
  return r.sort((a, b) => a[0] - b[0]);
}

// 乗換後の次列車を検索
function findConn(chibaArr, table) {
  const minDep = chibaArr + 3; // 乗換3分
  return table.find(t => t[0] >= minDep) || null;
}

let curPage = 0, dayMode = 'wd', dirMode = 'go';

// ============================================================
//  スワイプ
// ============================================================
const wrap = document.getElementById('wrap');
let tx0=0, ty0=0, sw=false;
wrap.addEventListener('touchstart', e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;sw=true;},{passive:true});
wrap.addEventListener('touchmove', e=>{
  if(!sw)return;
  if(Math.abs(e.touches[0].clientX-tx0)>Math.abs(e.touches[0].clientY-ty0))e.preventDefault();
},{passive:false});
wrap.addEventListener('touchend', e=>{
  if(!sw)return; sw=false;
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>44){
    if(dx<0&&curPage<2)goPage(curPage+1);
    if(dx>0&&curPage>0)goPage(curPage-1);
  }
});

function goPage(n){
  curPage=n;
  wrap.style.transform=`translateX(-${n*33.333}%)`;
  [0,1,2].forEach(i=>document.getElementById('d'+i).classList.toggle('on',i===n));
  if(n===2)renderTrains();
}

// ============================================================
//  時計
// ============================================================
const WDAYS=['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
function p2(n){return String(n).padStart(2,'0');}

let prevSec=-1;
function tickClock(){
  const n=new Date();
  const H=n.getHours(),M=n.getMinutes(),S=n.getSeconds();
  document.getElementById('ch').textContent=p2(H);
  document.getElementById('cm').textContent=p2(M);
  document.getElementById('clock-sec').textContent=p2(S);
  const bar=document.getElementById('sec-bar');
  if(S===0&&prevSec!==0){bar.style.transition='none';bar.style.width='0%';bar.offsetWidth;}
  bar.style.transition=S===0?'none':'width .9s linear';
  bar.style.width=(S/60*100)+'%';
  prevSec=S;
  document.getElementById('clock-date').textContent=
    `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日　${WDAYS[n.getDay()]}`;
  if(curPage===2)renderTrains();
}

// ============================================================
//  カレンダー
// ============================================================
function renderCal(){
  if(Object.keys(HOL).length===0||!Object.keys(HOL)[0].startsWith(calY))
    HOL=buildHolidays(calY);
  document.getElementById('cal-label').textContent=`${calY}年 ${calM+1}月`;
  const first=new Date(calY,calM,1).getDay();
  const last=new Date(calY,calM+1,0).getDate();
  const pLast=new Date(calY,calM,0).getDate();
  const tY=today.getFullYear(),tM=today.getMonth(),tD=today.getDate();
  let h='';
  for(let i=first-1;i>=0;i--){
    const col=first-1-i;
    h+=`<div class="cd other ${col===0?'sun':col===6?'sat':''}">${pLast-i}</div>`;
  }
  for(let d=1;d<=last;d++){
    const col=(first+d-1)%7;
    const isT=d===tD&&calY===tY&&calM===tM;
    const isH=HOL[`${calY}-${calM+1}-${d}`];
    let cls=col===0?'sun':col===6?'sat':isH?'hol':'';
    if(isT)cls+=' today';
    h+=`<div class="cd ${cls}">${d}</div>`;
  }
  const total=Math.ceil((first+last)/7)*7;
  for(let d=1;d<=total-first-last;d++){
    const col=(first+last+d-1)%7;
    h+=`<div class="cd other ${col===0?'sun':col===6?'sat':''}">${d}</div>`;
  }
  document.getElementById('cal-days').innerHTML=h;
}
document.getElementById('cal-prev').onclick=()=>{calM--;if(calM<0){calM=11;calY--;}renderCal();};
document.getElementById('cal-next').onclick=()=>{calM++;if(calM>11){calM=0;calY++;}renderCal();};

function setDay(m){
  dayMode=m;
  document.getElementById('btn-wd').classList.toggle('on',m==='wd');
  document.getElementById('btn-hd').classList.toggle('on',m==='hd');
  renderTrains();
}
function setDir(m){
  dirMode=m;
  document.getElementById('btn-go').classList.toggle('on',m==='go');
  document.getElementById('btn-rt').classList.toggle('on',m==='rt');
  renderTrains();
}
function fmt(m){
  if(m==null)return'--:--';
  const h=Math.floor(m/60)%24;
  return`${p2(h)}:${p2(m%60)}`;
}

function renderTrains(){
  const n=new Date();
  let now=n.getHours()*60+n.getMinutes();
  if(n.getHours()<5)now+=1440;

  const labels=['次の電車','その次','3本目','4本目','5本目'];
  let h='';

  if(dirMode==='go'){
    // 鎌取→幕張：KAM_SOGで全発車を取得し、直通 vs 蘇我乗換を比較
    const upcoming=KAM_SOG.filter(t=>t[0]>=now&&t[0]<=now+180).slice(0,5);
    if(!upcoming.length){
      document.getElementById('train-list').innerHTML=
        '<div class="no-train">この時間帯の電車はありません</div>';return;
    }
    upcoming.forEach((sogT,i)=>{
      const kamDep=sogT[0], sogArr=sogT[1];
      const wait=kamDep-now;
      const cdwn=wait===0?'発車中':wait===1?'あと1分':`あと${wait}分`;

      // 直通オプション（KAM_CHBにある列車）
      const direct=KAM_CHB.find(t=>t[0]===kamDep);
      const chibaArrDirect=direct?direct[1]:null;

      // 蘇我乗換オプション
      const sogConn=findConn(sogArr,SOG_CHB);
      const chibaArrSOG=sogConn?sogConn[1]:null;

      // 早い方を採用
      let chibaArr, viaTag;
      if(chibaArrDirect!==null&&(chibaArrSOG===null||chibaArrDirect<=chibaArrSOG)){
        chibaArr=chibaArrDirect; viaTag='直通';
      } else if(chibaArrSOG!==null){
        chibaArr=chibaArrSOG; viaTag='蘇我乗換';
      } else {
        chibaArr=null; viaTag='―';
      }

      // 千葉→幕張接続
      const connTable=dayMode==='wd'?CHB_MAK_WD:CHB_MAK_HD;
      const makConn=chibaArr?findConn(chibaArr,connTable):null;
      const destTime=makConn?makConn[1]:null;
      const destCls=makConn?'dest':'miss';

      h+=`
        <div class="tcard ${i===0?'nxt':''}">
          <div class="tcard-top">
            <div class="tc-left">
              <div class="tc-label">${labels[i]}</div>
              <div class="tc-dep">${fmt(kamDep)}</div>
              <div class="tc-dep-st">鎌取発</div>
            </div>
            <div class="tc-right">
              <div class="tc-row">
                <span class="tc-lbl">千葉着</span>
                <span class="tc-val">${chibaArr?fmt(chibaArr):'--:--'}</span>
              </div>
              <div class="tc-row ${destCls}">
                <span class="tc-lbl">幕張着</span>
                <span class="tc-val">${destTime?fmt(destTime):'接続なし'}</span>
              </div>
            </div>
          </div>
          <div class="tcard-bot">
            <span class="tc-via">${viaTag==='蘇我乗換'?'鎌取→蘇我乗換→千葉→幕張':'千葉 → 総武線 → 幕張'}</span>
            ${i===0?`<span class="tc-cdwn">${cdwn}</span>`:''}
          </div>
        </div>`;
    });
  } else {
    // 幕張→鎌取
    const list=SCHED[dayMode][dirMode];
    const upcoming=list.filter(t=>t[0]>=now&&t[0]<=now+180).slice(0,5);
    if(!upcoming.length){
      document.getElementById('train-list').innerHTML=
        '<div class="no-train">この時間帯の電車はありません</div>';return;
    }
    upcoming.forEach((t,i)=>{
      const wait=t[0]-now;
      const cdwn=wait===0?'発車中':wait===1?'あと1分':`あと${wait}分`;
      const chibaArr=t[1];
      const conn=findConn(chibaArr,CHB_KAM);
      const destTime=conn?conn[1]:null;
      const destCls=conn?'dest':'miss';
      h+=`
        <div class="tcard ${i===0?'nxt':''}">
          <div class="tcard-top">
            <div class="tc-left">
              <div class="tc-label">${labels[i]}</div>
              <div class="tc-dep">${fmt(t[0])}</div>
              <div class="tc-dep-st">幕張発</div>
            </div>
            <div class="tc-right">
              <div class="tc-row">
                <span class="tc-lbl">千葉着</span>
                <span class="tc-val">${fmt(chibaArr)}</span>
              </div>
              <div class="tc-row ${destCls}">
                <span class="tc-lbl">鎌取着</span>
                <span class="tc-val">${destTime?fmt(destTime):'接続なし'}</span>
              </div>
            </div>
          </div>
          <div class="tcard-bot">
            <span class="tc-via">千葉 → 外房線 → 鎌取</span>
            ${i===0?`<span class="tc-cdwn">${cdwn}</span>`:''}
          </div>
        </div>`;
    });
  }

  document.getElementById('train-list').innerHTML=h;
}

// ============================================================
//  初期化
// ============================================================
const dw=today.getDay();
const todayKey=`${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
dayMode=(dw===0||dw===6||HOL[todayKey])?'hd':'wd';
setDay(dayMode);
setDir('go');
renderCal();
tickClock();
setInterval(tickClock,1000);
applyTheme(THEMES[themeIdx]);
